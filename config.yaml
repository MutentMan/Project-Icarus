# Project Icarus Configuration
# Please fill in your API keys below

api_keys:
  haveibeenpwned: "YOUR_HIBP_API_KEY"
  numverify: "YOUR_NUMVERIFY_API_KEY"

modules:
  email_search:
    enabled: true
    concurrency_limit: 10
  phone_search:
    enabled: true
  social_search:
    enabled: true
    sites_list: "modules/data.json" # Path to data file if needed, or hardcoded

ai_engine:
  enabled: true
  provider: "nvidia"
  base_url: "https://integrate.api.nvidia.com/v1"
  api_key: ""
  model: "nvidia/nemotron-3-ultra-550b-a55b"
  max_tokens: 16384
  reasoning_budget: 16384
  temperature: 1.0
  top_p: 0.95
  # Prompt to summarize the findings
  prompt_template: "You are an OSINT analyst. Summarize the following findings for the target: {target}. Findings: {data}"
